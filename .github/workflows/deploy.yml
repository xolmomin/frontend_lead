name: Build & Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOY_DIR: /var/www/lidlar.uz/frontend

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    if: github.actor == 'xolmomin' || github.actor == 'Kholmumin'
    steps:
      # An unset GHCR_PAT/GHCR_USER used to surface only in the deploy step, after the full
      # build, as docker's "password is empty" — which names neither the secret nor the repo.
      - name: Check required secrets
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
        run: |
          [ -n "$GHCR_PAT" ] || {
            echo "::error::GHCR_PAT secret is not set — see backend_lead/DEPLOY.md section 1"
            exit 1
          }
          [ -n "$GHCR_USER" ] || {
            echo "::error::GHCR_USER secret is not set — GHCR username used for the VPS pull login"
            exit 1
          }

      # Runs before the image build so a misconfigured VPS fails in seconds instead of after a
      # full Next build, and with a message drone-scp cannot produce.
      - name: Check VPS deploy directory and .env
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_DIR
          script: |
            set -eu
            test -d "$DEPLOY_DIR" || {
              echo "::error::$DEPLOY_DIR does not exist. On the VPS run: sudo mkdir -p $DEPLOY_DIR && sudo chown -R \$USER:\$USER /var/www/lead"
              exit 1
            }
            test -w "$DEPLOY_DIR" || {
              echo "::error::$DEPLOY_DIR is not writable by $(whoami). Run: sudo chown -R \$USER:\$USER /var/www/lead"
              exit 1
            }
            # .env holds only IMAGE, but compose interpolation needs the file to exist — without
            # it the deploy step's sed has nothing to pin and rollback stops working.
            test -f "$DEPLOY_DIR/.env" || {
              echo "::error::$DEPLOY_DIR/.env missing — see .env.prod.example"
              exit 1
            }
            echo "Preflight OK: $DEPLOY_DIR ready"

  build-and-push:
    name: Build & Push Image
    needs: preflight
    runs-on: ubuntu-latest
    if: github.actor == 'xolmomin' || github.actor == 'Kholmumin'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # NEXT_PUBLIC_API_URL is inlined into the client bundle at build time (src/lib/api.ts);
      # a runtime env var would be ignored, so it must be a build-arg.
      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'https://lead-back.pravaol.uz/api/v1' }}
          secrets: |
            next_server_actions_key=${{ secrets.SERVER_ACTIONS_KEY }}

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.actor == 'xolmomin' || github.actor == 'Kholmumin'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # Forwarded through envs: rather than interpolated into the script — the action
          # echoes the rendered script to the log, where an empty secret is all that shows.
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          IMAGE_TAG: sha-${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_DIR,IMAGE_REPO,IMAGE_TAG,GHCR_PAT,GHCR_USER
          script: |
            set -eu
            cd "$DEPLOY_DIR"

            # Pin the running image to this commit. Compose reads IMAGE from .env, so a
            # rollback is one line in .env instead of an edit the next deploy overwrites.
            IMAGE_REF="${IMAGE_REPO}:${IMAGE_TAG}"
            if grep -q '^IMAGE=' .env; then
              sed -i "s|^IMAGE=.*|IMAGE=${IMAGE_REF}|" .env
            else
              echo "IMAGE=${IMAGE_REF}" >> .env
            fi

            printf '%s' "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Same lock file as the backend deploy: both stacks share one VPS and one docker daemon.
            flock .deploy.lock -c '
              set -e
              docker compose -f docker-compose.prod.yml pull frontend
              docker compose -f docker-compose.prod.yml up -d --remove-orphans \
                --wait --wait-timeout 120
            '

            # Keep the last 3 images for rollback, drop older ones. The in-use image is the
            # newest, so it is never in this list; `|| true` covers a tag still held elsewhere.
            docker images "$IMAGE_REPO" --format '{{.ID}}' | tail -n +4 | xargs -r docker rmi -f || true
            docker image prune -f

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          IMAGE_TAG: sha-${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_DIR,IMAGE_REPO,IMAGE_TAG
          script: |
            set -eu
            cd "$DEPLOY_DIR"

            fail() {
              echo "::error::$1"
              docker compose -f docker-compose.prod.yml ps
              echo "--- frontend logs ---"
              docker compose -f docker-compose.prod.yml logs frontend --tail 50
              exit 1
            }

            expected="${IMAGE_REPO}:${IMAGE_TAG}"
            running=$(docker inspect lead-frontend -f '{{.Config.Image}}' 2>/dev/null || echo missing)
            [ "$running" = "$expected" ] || fail "lead-frontend runs '$running', expected '$expected' (stale container?)"

            status=$(docker inspect -f '{{.State.Health.Status}}' lead-frontend 2>/dev/null || echo missing)
            [ "$status" = "healthy" ] || fail "lead-frontend health is '$status', expected 'healthy'"

            # The published port is what the reverse proxy actually talks to; an in-container
            # health check passing while the port mapping is wrong still means a 502 for users.
            curl -fsS -o /dev/null http://172.17.0.1:3002/ \
              || fail "http://172.17.0.1:3002/ unreachable from the host (port mapping?)"

            echo "Deploy verified: $expected healthy, reachable on 172.17.0.1:3002"
